; ============================================================================
; LAMP-LINK - PlatformIO project configuration
; ----------------------------------------------------------------------------
; Two build targets, one codebase. Both compile the SAME src/main.cpp.
; Flash from the bottom status bar in VS Code, or from the terminal:
; pio run -e lampA -t upload
; pio run -e lampB -t upload
; ============================================================================

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = knolleary/PubSubClient@^2.8

[env:lampA]
board = esp32dev

[env:lampB]
board = esp32dev
